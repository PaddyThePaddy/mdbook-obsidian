<style>
@font-face {
  font-family: 'Virgil';
  src: url('https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Virgil.woff2') format('woff2');
  font-display: swap;
}
@font-face {
  font-family: 'Cascadia';
  src: url('https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Cascadia.woff2') format('woff2');
  font-display: swap;
}
@font-face {
  font-family: 'Assistant';
  src: url('https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Assistant-Regular.woff2') format('woff2');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Assistant';
  src: url('https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Assistant-Medium.woff2') format('woff2');
  font-weight: 500;
  font-display: swap;
}
@font-face {
  font-family: 'Assistant';
  src: url('https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Assistant-SemiBold.woff2') format('woff2');
  font-weight: 600;
  font-display: swap;
}
@font-face {
  font-family: 'Assistant';
  src: url('https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Assistant-Bold.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
</style>

<div id="excalidraw-root" style="width:100%;height:80vh;border-radius:4px;overflow:hidden;"></div>

<script type="application/json" id="excalidraw-scene">{{SCENE_JSON}}</script>

<script>
(function () {
  var CDN = {
    react:      'https://unpkg.com/react@18/umd/react.production.min.js',
    reactDom:   'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
    excalidraw: 'https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js',
  };

  // Font family IDs added in Excalidraw ≥0.18 that v0.17.6 doesn't know.
  // Map them to visually similar families that v0.17.6 supports (1-4).
  var FONT_FAMILY_MAP = {
    5: 1,  // Excalifont → Virgil (both hand-drawn)
    6: 4,  // Nunito → Assistant (both clean sans-serif)
    7: 2,  // Lilita One → Helvetica
    8: 3,  // Comic Shanns → Cascadia (both code-like)
    9: 2,  // Liberation Sans → Helvetica
  };

  function patchElements(elements) {
    if (!elements) return elements;
    return elements.map(function (el) {
      if (el.type === 'text' && FONT_FAMILY_MAP[el.fontFamily] !== undefined) {
        return Object.assign({}, el, { fontFamily: FONT_FAMILY_MAP[el.fontFamily] });
      }
      return el;
    });
  }

  function loadScript(src, cb) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    document.head.appendChild(s);
  }

  function isDark() {
    var cl = document.documentElement.classList;
    return cl.contains('coal') || cl.contains('navy') || cl.contains('ayu');
  }

  function mount() {
    var scene = JSON.parse(document.getElementById('excalidraw-scene').textContent);
    var root  = ReactDOM.createRoot(document.getElementById('excalidraw-root'));
    root.render(React.createElement(ExcalidrawLib.Excalidraw, {
      initialData: {
        elements: patchElements(scene.elements || []),
        appState:  Object.assign({}, scene.appState, { theme: isDark() ? 'dark' : 'light' }),
        files:     scene.files || {},
      },
      viewModeEnabled: true,
    }));
  }

  loadScript(CDN.react, function () {
    loadScript(CDN.reactDom, function () {
      loadScript(CDN.excalidraw, mount);
    });
  });
})();
</script>
